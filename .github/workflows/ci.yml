name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files exist
        run: |
          test -f README.md
          test -f docker-compose.yml
          test -f backend/requirements.txt